app:
  host: 127.0.0.1
  port: 8002
  cors_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
  # Next.js may select another port when 3000 is already occupied.
  # Keep browser access restricted to services running on this computer.
  cors_origin_regex: '^https?://(localhost|127\.0\.0\.1)(:\d+)?$'

llm:
  model: openai/gpt-5.6-luna

search:
  # The configured Serper credential is currently unauthorized (HTTP 403).
  # Use Gemini Google Search grounding directly for reliable live research.
  provider: gemini
  model: gemini-3.5-flash

crew:
  verbose: true

